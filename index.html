<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nextravel Quote Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout idea: left column is the form Chris fills in, right column is the live quote. On a phone the two become tabs. Single light theme on purpose so every quote looks the same. */
:root{
  --navy:#0E4C7A; --blue:#1583D8; --orange:#FFA31A; --deep:#F26522; --sky:#CFE3F3;
  --ink:#16222e; --muted:#5b6b7a; --line:#d9e3ec; --paper:#ffffff; --bg:#eef4f9;
  --display:'Bricolage Grotesque','Trebuchet MS',sans-serif; --body:'Outfit','Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}

/* ---------- app shell ---------- */
.bar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 16px}
.bar h1{font-family:var(--display);font-size:20px;margin:0}
.bar .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:99px;padding:9px 18px;font-weight:600;cursor:pointer;background:var(--paper);color:var(--navy)}
.btn.main{background:var(--orange);color:#3a2200}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6)}
.btn.small{padding:6px 12px;font-size:14px;background:var(--bg);border:1px solid var(--line)}
.btn[disabled]{opacity:.6;cursor:wait}
.tabs{display:none}
.viewer .bar,.viewer .tabs,.viewer .form,.viewer .linkbox{display:none!important}
.viewer .app{display:block;max-width:1100px;padding:16px}
.viewer .preview-wrap{display:block!important;visibility:hidden}
.viewer.ready .preview-wrap{visibility:visible}
.linkbox{background:var(--sky);padding:10px 16px;display:none;gap:8px;align-items:center;flex-wrap:wrap;color:var(--navy)}
.linkbox.on{display:flex}
.linkbox input{flex:1;min-width:220px;border:1.5px solid var(--navy);border-radius:10px;padding:8px 10px;background:#fff}
.linkbox small{flex-basis:100%;color:var(--muted)}
.app{display:grid;grid-template-columns:400px 1fr;gap:20px;max-width:1500px;margin:0 auto;padding:16px}
.form{display:flex;flex-direction:column;gap:14px}
.preview-wrap{min-width:0}
@media(max-width:1000px){
  .app{grid-template-columns:1fr}
  .tabs{display:flex;gap:6px;padding:10px 16px 0;max-width:1500px;margin:0 auto}
  .tabs button{flex:1;border:0;border-radius:12px 12px 0 0;padding:10px;font-weight:600;background:var(--sky);color:var(--navy);cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--paper)}
  body[data-view="fill"] .preview-wrap{display:none}
  body[data-view="preview"] .form{display:none}
}
fieldset{border:0;background:var(--paper);border-radius:14px;padding:14px 16px 16px;margin:0;min-width:0}
legend{font-family:var(--display);font-size:18px;color:var(--navy);padding:0;margin-bottom:8px;float:left;width:100%}
fieldset>*{clear:both}
.f{display:flex;flex-direction:column;gap:3px;margin-top:10px}
.f label{font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f textarea,.f select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;width:100%}
.f textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:15px}
.chk input{width:18px;height:18px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.photo-row{display:flex;gap:10px;align-items:center;margin-top:10px}
.photo-row img{width:84px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.status{font-size:14px;color:#fff;opacity:.95;min-height:1.4em}

/* ---------- the quote itself (identical on screen and in saved files) ---------- */
.q{max-width:1040px;margin:0 auto;font-family:var(--body);color:var(--ink);line-height:1.45}
.q *{box-sizing:border-box}
.q header.top{background:var(--paper);border-radius:18px 18px 0 0;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 24px;border-bottom:5px solid var(--orange)}
.q header.top img{height:96px;width:auto;display:block}
.q .prepared{text-align:right;font-size:14px;color:var(--muted)}
.q .prepared strong{display:block;color:var(--navy);font-size:16px;font-weight:600}
.q .intro{background:var(--paper);padding:24px 24px 8px}
.q .intro h1{font-family:var(--display);font-size:clamp(26px,4.5vw,38px);color:var(--navy);margin:0 0 6px;text-wrap:balance;line-height:1.1}
.q .intro p.hi{margin:12px 0 0;max-width:62ch;font-size:17px;white-space:pre-line}
.q .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0 6px}
.q .fact{background:var(--bg);border-radius:12px;padding:10px 14px}
.q .fact span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.q .fact b{font-weight:600;color:var(--navy);font-size:17px}
.q .options{background:var(--paper);padding:18px 24px 26px;display:grid;gap:16px;align-items:stretch}
.q .options.n1{grid-template-columns:minmax(0,520px);justify-content:center}
.q .options.n2{grid-template-columns:repeat(2,1fr)}
.q .options.n3{grid-template-columns:repeat(3,1fr)}
@media(max-width:860px){.q:not(.force) .options{grid-template-columns:1fr!important}}
.q .card{border:1.5px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;background:var(--paper);position:relative}
.q .card.pick{border-color:var(--orange);box-shadow:0 6px 22px rgba(255,163,26,.25)}
.q .ribbon{position:absolute;top:12px;left:12px;background:var(--orange);color:#3a2200;font-weight:600;font-size:13px;padding:4px 12px;border-radius:99px;z-index:1}
.q .card img{width:100%;height:150px;object-fit:cover;display:block}
.q .card .body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.q .tag{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);font-weight:600}
.q .card h2{font-family:var(--display);font-size:22px;line-height:1.15;margin:0;color:var(--navy)}
.q .sub{color:var(--muted);font-size:14px;margin-top:-6px}
.q .price{background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px}
.q .price .big{font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.q .price .big small{font-family:var(--body);font-size:14px;font-weight:400;opacity:.85}
.q .price .tot{font-size:14px;opacity:.9;margin-top:4px;font-variant-numeric:tabular-nums}
.q dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
.q dt{color:var(--muted)}
.q dd{margin:0;font-weight:500;text-align:right}
.q ul.inc{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:15px}
.q ul.inc li{padding-left:24px;position:relative}
.q ul.inc li::before{content:"";position:absolute;left:2px;top:.35em;width:12px;height:7px;border-left:2.5px solid var(--blue);border-bottom:2.5px solid var(--blue);transform:rotate(-45deg)}
.q ul.inc li.no{color:var(--muted)}
.q ul.inc li.no::before{border:none;width:10px;height:2.5px;background:var(--deep);transform:none;top:.62em;left:3px}
.q .hdr{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:-4px;font-weight:600}
.q .acts{margin-top:14px;border-top:1.5px dashed var(--line);padding-top:12px}
.q .acts .hdr{margin-top:0}
.q .act{padding:9px 0;border-bottom:1px solid var(--line)}
.q .act:last-of-type{border-bottom:0}
.q .act b{display:block;font-family:var(--display);font-size:16px;color:var(--navy);line-height:1.2}
.q .act .am{font-size:13px;color:var(--muted)}
.q .act .an{font-size:14px;margin-top:2px}
.q .act .ap{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.q .act .ap span{background:var(--bg);border-radius:8px;padding:3px 9px;font-size:13px;font-variant-numeric:tabular-nums}
.q .act .ap span.g{background:var(--navy);color:#fff}
.q .acts .atot{margin-top:8px;background:var(--sky);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--navy);font-size:14px;font-variant-numeric:tabular-nums}
.xform{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.q .terms{background:var(--sky);padding:16px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 24px;font-size:15px}
.q .terms div span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);opacity:.75}
.q .terms div b{font-weight:600;color:var(--navy)}
.q .backup{background:var(--paper);padding:22px 24px 6px}
.q .backup h3,.q .next h3{font-family:var(--display);font-size:20px;color:var(--navy);margin:0 0 4px}
.q .backup p{margin:0 0 12px;color:var(--muted);font-size:15px}
.q .backup img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.q .next{background:var(--paper);padding:22px 24px 26px;border-radius:0 0 18px 18px}
.q .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0 18px;padding:0;list-style:none;counter-reset:s}
.q .steps li{background:var(--bg);border-radius:12px;padding:12px 14px 12px 50px;position:relative;font-size:15px;counter-increment:s}
.q .steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--orange);color:#3a2200;font-weight:600;display:grid;place-items:center}
.q .cta{display:inline-block;background:var(--deep);color:#fff;text-decoration:none;font-weight:600;padding:13px 24px;border-radius:99px;font-size:17px}
.q .ctalink{font-size:13px;color:var(--muted);margin-top:8px}
.q .contact{margin-top:16px;color:var(--muted);font-size:14px}
.q .contact b{color:var(--navy);font-weight:600}
.q .fine{font-size:12px;color:var(--muted);margin-top:14px;max-width:80ch}
</style>
</head>
<body data-view="fill">
<div class="bar">
  <h1>Quote maker</h1>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="acts">
    <button class="btn ghost" id="blankBtn" type="button">Start a blank quote</button>
    <button class="btn" id="linkBtn" type="button">Get a link to send</button>
    <button class="btn" id="webBtn" type="button">Save as web page</button>
    <button class="btn" id="pngBtn" type="button">Save as picture</button>
    <button class="btn main" id="pdfBtn" type="button">Save as PDF</button>
  </div>
</div>
<div class="linkbox" id="linkbox"><b>Link to send:</b><input id="linkOut" readonly aria-label="Link to send"><button class="btn small" id="copyLink" type="button">Copy</button><small>The whole quote is inside this link. Photos you added yourself are not included in the link (the built-in photos are). Make a new link after any change.</small></div>
<div class="tabs" role="tablist">
  <button type="button" role="tab" id="tabFill" aria-selected="true">1. Fill in</button>
  <button type="button" role="tab" id="tabPrev" aria-selected="false">2. See the quote</button>
</div>
<div class="app">
  <div class="form" id="form"></div>
  <div class="preview-wrap"><div id="preview"></div></div>
</div>

function onInput(e){

  else if(t.id==='ret'){S.ret=t.value; if(S.depart&&S.ret){const d=Math.round((pd(S.ret)-pd(S.depart))/DAY); if(d>=1&&d<=60){S.nights=d;setVal('nights',d);} }}
  else if(t.id==='nights'){S.nights=+t.value; if(S.depart){S.ret=addDays(S.depart,S.nights);setVal('ret',S.ret);}}

}

function shrink(file,maxW,q){return new Promise((res,rej)=>{
  const fr=new FileReader(); fr.onerror=rej;
  fr.onload=()=>{const im=new Image(); im.onerror=rej; im.onload=()=>{
    const r=Math.min(1,maxW/im.width); const c=document.createElement('canvas'); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q));};
    im.src=fr.result;}; fr.readAsDataURL(file);});}
F.addEventListener('change',async e=>{
  const t=e.target; if(t.type!=='file'||!t.files.length) return;
  try{
    if(t.dataset.photo!==undefined){S.options[+t.dataset.photo].photo=await shrink(t.files[0],900,.82);}
    else if(t.id==='supfile'){for(const f of t.files){S.supplier.push(await shrink(f,1400,.85));}}
    renderForm();renderPreview();saveDraft();
  }catch(err){say("That picture would not load. Try a different one.");}
});

async function doSave(kind){
  const btn=document.getElementById(kind+'Btn'); btn.disabled=true; say('Getting your quote ready…');
  try{
    if(kind==='web'){
      let css='';
      for(const sh of document.styleSheets){let rules; try{rules=sh.cssRules;}catch(e){continue;}
        for(const r of rules){const x=r.cssText; if(/^(:root|\*|html, body)/.test(x)||x.includes('.q')) css+=x+'\n';}}
      const doc='<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>'+esc('Your trip quote from Nextravel')+'</title>'+
        '<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">'+
        '<style>'+css+'body{margin:0;padding:16px 16px 40px;background:#eef4f9}</style></head><body><div class="q">'+quoteHTML()+'</div></body></html>';
      await DL.save({filename:fname('html'),data:doc});
    } else {
    const {canvas:c,links}=await capture();
    if(kind==='png'){
      const blob=await new Promise(r=>c.toBlob(r,'image/png'));
      await DL.save({filename:fname('png'),data:blob});
    }else{
      const {jsPDF}=window.jspdf; const w=c.width,h=c.height;
      const pdf=new jsPDF({orientation:w>h?'l':'p',unit:'px',format:[w/2,h/2],hotfixes:['px_scaling']});
      pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,w/2,h/2);
      links.forEach(l=>pdf.link(l.x,l.y,l.w,l.h,{url:l.url}));
      await DL.save({filename:fname('pdf'),data:pdf.output('blob')});
    }
    }
    say('Saved.');
  }catch(err){ say(err&&err.code==='declined'?'Not saved.':'That did not save. Please try again.'); }
  finally{btn.disabled=false;}
}

const b64u=u8=>{let s='';u8.forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
async function pipe(u8,Stream){const s=new Blob([u8]).stream().pipeThrough(new Stream('deflate-raw'));return new Uint8Array(await new Response(s).arrayBuffer());}
async function encodeQuote(){
  const o=JSON.parse(JSON.stringify(S)); o.options.forEach(x=>{x.photo=null;}); o.supplier=[];
  const raw=new TextEncoder().encode(JSON.stringify(o));
  if(window.CompressionStream){try{return 'z.'+b64u(await pipe(raw,CompressionStream));}catch(e){}}
  return 'p.'+b64u(raw);
}
async function decodeQuote(kind,data){
  let u=unb64u(data); if(kind==='z') u=await pipe(u,DecompressionStream);
  return JSON.parse(new TextDecoder().decode(u));
}
document.getElementById('linkBtn').onclick=async()=>{
  try{
    const link=location.href.split('#')[0]+'#q='+await encodeQuote();
    const box=document.getElementById('linkbox'),inp=document.getElementById('linkOut');
    box.classList.add('on'); inp.value=link; inp.focus(); inp.select();
    try{await navigator.clipboard.writeText(link); say('Link copied.');}catch(e){say('Link ready. Copy it from the box.');}
  }catch(e){say('Could not make the link. Please try again.');}
};
document.getElementById('copyLink').onclick=async()=>{const inp=document.getElementById('linkOut');inp.select();try{await navigator.clipboard.writeText(inp.value);say('Link copied.');}catch(e){say('Press Ctrl+C to copy.');}};
async function loadShared(){
  try{
    const d=await decodeQuote(HASH[1],HASH[2]);
    if(!d||!d.options) throw 0;
    S=d; document.title='Your trip quote from Nextravel'; renderPreview();
  }catch(e){
    document.getElementById('preview').innerHTML='<div style="padding:40px 16px;text-align:center;font-family:var(--body)"><h2>This link looks incomplete</h2><p>Please ask Chris to send it again.</p></div>';
  }
  document.documentElement.classList.add('ready');
}

renderForm();renderPreview();
if(VIEW) loadShared();
</script>
